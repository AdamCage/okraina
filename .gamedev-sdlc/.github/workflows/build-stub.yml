# из корневого AGENTS.md. Не хранить secrets в этом файле.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/build-stub.yml"

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain
        run: |
          echo "Replace this job with Godot headless test/export commands."
          echo "PC and mobile export presets belong in the product repo AGENTS.md."
          echo "Use GitHub Environments/Secrets for signing — never commit keystores."
